<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Herramienta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Registrar Nueva Herramienta</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/guardar}" th:object="${herramienta}" method="post">
                
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre de la Herramienta:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Pulidora Angular">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marca:</label>
                        <input type="text" th:field="*{marca}" class="form-control" required placeholder="Ej. Bosch">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="0.00">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL de la Imagen:</label>
                        <input type="url" th:field="*{imagen}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                        <div class="form-text">Puedes pegar el enlace de cualquier imagen de internet.</div>
                    </div>


                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0">Categoría:</label>
                            <a th:href="@{/categoria/nueva}" class="btn btn-sm btn-outline-primary">+ Crear Nueva Categoría</a>
                        </div>
                        
                        <select th:field="*{categoria}" class="form-select" required>
                            <option value="" disabled selected>-- Seleccione una Categoría --</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                        </select>
                    </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a th:href="@{/tabla}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Registro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
