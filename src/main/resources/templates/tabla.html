<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
    
    
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Inventario</h2>
            <div>
            
                <a th:href="@{/}" class="btn btn-secondary me-2">Ver Catálogo</a>
                <a th:href="@{/nueva}" class="btn btn-primary">+ Añadir Herramienta</a>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Imagen</th>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${herramientas}" class="align-middle">
                            <td>
                                <img th:src="${h.imagen != null && h.imagen != '' ? h.imagen : 'https://via.placeholder.com/50x50?text=N/A'}" 
                                     alt="Mini" class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td th:text="${h.id}"></td>
                            <td th:text="${h.nombre}" class="fw-bold"></td>
                            <td th:text="${h.marca}"></td>
                            <td th:text="'$' + ${h.precio}" class="text-success fw-bold"></td>
                            <td th:text="${h.categoria?.nombre}"></td>
                            <td class="text-center">
    							<a th:href="@{/editar/{id}(id=${h.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
    
    							<a th:href="@{/eliminar/{id}(id=${h.id})}" class="btn btn-danger btn-sm"
       								onclick="return confirm('¿Seguro que deseas eliminar esta herramienta?');">Eliminar</a>
							</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
