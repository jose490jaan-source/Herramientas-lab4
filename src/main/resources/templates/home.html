<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Herramientas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="/">
                
                <img th:src="@{/images/logo.png}" 
                     alt="Logo Ferretería Alvarado" 
                     width="40" 
                     height="40" 
                     class="me-2 img-fluid">
                
                <span class="fw-bold text-uppercase" style="letter-spacing: 1px;">Ferretería Alvarado</span>
            </a>
            <a th:href="@{/tabla}" class="btn btn-outline-info">Modo Administrador</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4 text-secondary">Catálogo de herramientas</h1>
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="h : ${herramientas}">
                <div class="card h-100 shadow-sm">
				<div style="height: 200px; background-color: #ffffff; overflow: hidden;" class="w-100 d-flex align-items-center justify-content-center border-bottom">
                        <img th:src="${h.imagen != null && h.imagen != '' ? h.imagen : 'https://via.placeholder.com/300x200?text=Sin+Imagen'}" 
                             alt="Imagen de herramienta" 
                             style="width: 100%; height: 100%; object-fit: contain; padding: 15px;">
                    </div>
                    
                    <div class="card-body">
                        <h5 class="card-title text-primary" th:text="${h.nombre}">Nombre</h5>
                        <p class="card-text mb-1"><strong>Marca:</strong> <span class="badge bg-secondary" th:text="${h.marca}">Marca</span></p>
                        <p class="card-text"><strong>Categoría:</strong> <span th:text="${h.categoria?.nombre}">Categoría</span></p>
                    </div>
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                        <span class="fs-5 text-success fw-bold" th:text="'$' + ${h.precio}">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
