<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Añadir Nueva Categoría</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre de la Categoría:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Herramientas de Jardinería" autofocus>
                        <div class="form-text">Al guardarla, estará disponible inmediatamente para tus herramientas.</div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a th:href="@{/nueva}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Categoría</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
