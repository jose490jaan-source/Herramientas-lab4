<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="/">Ferretería Alvarado</a>
            <a th:href="@{/nueva}" class="btn btn-outline-light btn-sm">Volver al Formulario de Herramientas</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-header text-white" th:classappend="${categoria.id != null} ? 'bg-warning text-dark' : 'bg-info'">
                        <h5 class="mb-0" th:text="${categoria.id != null} ? 'Modificar Categoría' : 'Nueva Categoría'"></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Nombre de la Categoría:</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Jardinería" autofocus>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Guardar Categoría</button>
                                <a th:href="@{/categoria/nueva}" class="btn btn-sm btn-secondary" th:if="${categoria.id != null}">Cancelar Edición</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Categorías Disponibles en el Sistema</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-secondary">
                                <tr>
                                    <th style="width: 15%">ID</th>
                                    <th>Nombre de la Categoría</th>
                                    <th class="text-center" style="width: 30%">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categorias}">
                                    <td th:text="${cat.id}"></td>
                                    <td th:text="${cat.nombre}" class="fw-bold"></td>
                                    <td class="text-center">
                                        <a th:href="@{/categoria/editar/{id}(id=${cat.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                                        
                                        <a th:href="@{/categoria/eliminar/{id}(id=${cat.id})}" class="btn btn-danger btn-sm"
                                           onclick="return confirm('¿Estás seguro de eliminar esta categoría? Nota: Se eliminarán también las herramientas asociadas a ella.');">
                                            Eliminar
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categorias)}">
                                    <td colspan="3" class="text-center text-muted py-3">No hay categorías registradas en este momento.</td>
                                end text
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
